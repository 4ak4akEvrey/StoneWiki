site_name: Stoneland Wiki
site_description: Вики Stoneland
site_url: https://4ak4akevrey.github.io/StoneWiki/


theme:
  name: material
  custom_dir: overrides
  language: ru
  logo: assets/images/logo.png
  favicon: assets/images/favicon.png
  font:
    text: Manrope
    code: JetBrains Mono
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Тёмная тема
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.tabs
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra:
  generator: false

nav:
  - Механики:
    - 🧭 Основное:
      - 🏠 Главная: index.md
      - 🌱 Первые шаги: start/start.md
      - 🎭 Ролевая игра: main/roleplay.md
      - 🌡️ Температура: main/temperature.md
      - 🎵 Музыка: main/music.md
    - ⚔️ Расы:
      - 📋 Обзор: main/races/index.md
      - 🧑 Люди: main/races/human.md
      - ⛏️ Гномы: main/races/dwarf.md
      - 🌿 Эльфы: main/races/elf.md
      - 🐈 Каджиты: main/races/khajiit.md
      - 🐸 Монгреллы: main/races/mongrel.md
      - 👹 Огры: main/races/ogre.md
      - 🔥 Тифлинги: main/races/tiefling.md
    - 🏰 Города:
      - 📋 Основы: main/town/index.md
      - 🏗️ Система построек: main/town/systems.md
      - 💰 Экономика: main/town/innovations.md
      - 🗺️ Наделы: main/town/advisors.md
      - 📜 Договоры: main/town/contracts.md
  - Лор:
    - 🧭 Новому игроку: lore/novomu-igroku.md
    - 🌍 Мир:
      - 🌍 О нашем мире: lore/mir/index.md
      - 📅 Летоисчисление: lore/mir/letoischislenie.md
    - 🛡️ Силы Рерума:
      - 🛡️ Обзор: lore/frakcii/index.md
      - 👑 Аврелийская империя: lore/frakcii/imperiya.md
      - 🏯 Восточные кланы: lore/frakcii/vostochnye-klany.md
      - 🐉 Монстры: lore/frakcii/monstry.md
      - 🗡️ Орден Праведного Века: lore/frakcii/orden.md
    - 🧬 Расы Морнхейма:
      - 🧬 Обзор: lore/rasy/index.md
      - 🧑 Люди: lore/rasy/lyudi.md
      - ⛏️ Гномы: lore/rasy/gnomy.md
      - 🔥 Тифлинги: lore/rasy/tiflingi.md
      - 🐸 Монгреллы: lore/rasy/mongrelly.md
      - 🌿 Эльфы: lore/rasy/elfy.md
    - 📜 История Рерума:
      - 📜 Обзор: lore/istoriya/index.md
      - 🏕️ Древние времена: lore/istoriya/drevnie-vremena.md
      - 👑 Король монстров: lore/istoriya/korol-monstrov.md
      - 💍 Невеста Короля: lore/istoriya/nevesta-korolya.md
      - 🔥 Пламя Востока: lore/istoriya/plamya-vostoka.md
      - ⚓ Покорение Рерума: lore/istoriya/pokorenie.md
    - 📖 Праведный Завет:
      - 📖 О Завете: lore/zavet/index.md
      - 📜 I. О временах прежде Завета: lore/zavet/kniga-01.md
      - 📜 II. О призвании Аврелия: lore/zavet/kniga-02.md
      - 📜 III. О мятеже и взятии Аксиса: lore/zavet/kniga-03.md
      - 📜 IV. О пещерах и предательстве: lore/zavet/kniga-04.md
      - 📜 V. О Проклятии: lore/zavet/kniga-05.md
      - 📜 VI. О Воскрешении: lore/zavet/kniga-06.md
      - 📜 VII. О Благодати: lore/zavet/kniga-07.md
      - 📜 VIII. О Дарах Крови: lore/zavet/kniga-08.md
      - 📜 IX. О Священной войне: lore/zavet/kniga-09.md
      - 📜 X. О наследнике и наречении Империи: lore/zavet/kniga-10.md

markdown_extensions:
  - meta
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      title: На этой странице
      permalink: true

hooks:
  - hooks/stoneland.py

extra_css:
  - assets/stylesheets/extra.css?v=5

extra_javascript:
  - assets/javascripts/transitions.js?v=5

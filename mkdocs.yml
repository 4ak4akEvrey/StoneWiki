site_name: Stoneland Wiki
site_description: Вики Stoneland
site_url: https://4ak4akevrey.github.io/StoneWiki/


theme:
  name: material
  custom_dir: overrides
  language: ru
  logo: assets/images/logo.png
  favicon: assets/images/favicon.png
  font:
    text: Manrope
    code: JetBrains Mono
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Тёмная тема
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.tabs
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra:
  generator: false

nav:
  - Механики:
    - 🧭 Основное:
      - 🏠 Главная: index.md
      - 🌱 Первые шаги: start/start.md
      - 🎭 Ролевая игра: main/roleplay.md
      - 🌡️ Температура: main/temperature.md
      - 🎵 Музыка: main/music.md
    - ⚔️ Расы:
      - 📋 Обзор: main/races/index.md
      - 🧑 Люди: main/races/human.md
      - ⛏️ Гномы: main/races/dwarf.md
      - 🌿 Эльфы: main/races/elf.md
      - 🐈 Каджиты: main/races/khajiit.md
      - 🐸 Монгреллы: main/races/mongrel.md
      - 👹 Огры: main/races/ogre.md
      - 🔥 Тифлинги: main/races/tiefling.md
    - 🏰 Города:
      - 📋 Основы: main/town/index.md
      - 🏗️ Система построек: main/town/systems.md
      - 💰 Экономика: main/town/innovations.md
      - 🗺️ Наделы: main/town/advisors.md
      - 📜 Договоры: main/town/contracts.md
  - Лор:
    - 🧭 Новому игроку: lore/novomu-igroku.md
    - 🌍 Мир: lore/mir.md
    - 🛡️ Силы Рерума: lore/sily.md
    - 🧬 Расы Морнхейма: lore/rasy.md
    - 📜 История Рерума: lore/istoriya.md
    - 📖 Праведный Завет: lore/zavet.md

markdown_extensions:
  - meta
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      title: На этой странице
      permalink: true

hooks:
  - hooks/stoneland.py

extra_css:
  - assets/stylesheets/extra.css?v=6

extra_javascript:
  - assets/javascripts/transitions.js?v=6
